<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Versions for Gemini</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Message Versions for Gemini</h1>
  <p>When you edit an earlier prompt in Gemini, the old path is kept. Switch between versions with <strong>&lsaquo; 1 / 2 &rsaquo;</strong> under the message.</p>
  <label class="switch-row">
    <span class="switch-text">
      <span class="switch-label">Message versions</span>
      <span class="switch-hint">Only edits made while this is on are kept</span>
    </span>
    <input type="checkbox" data-setting="showTimelines" role="switch">
  </label>
  <p class="note">Versions are stored only on this device. Not affiliated with Google.</p>
  <a class="open" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Open Gemini</a>
  <script src="popup.js"></script>
</body>
</html>
