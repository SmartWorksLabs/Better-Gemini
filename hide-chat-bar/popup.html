  <h1>Hide Chat Bar for Gemini</h1>
  <p>On Gemini, the chat bar stays hidden until you need it. Use the <strong>Hide Chat Bar</strong> button on the page to choose how it comes back.</p>
  <p>Typing a letter, or pasting, anywhere on the page puts it in the chat box when that option is on.</p>
  <p class="note">Not affiliated with Google.</p>
